
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robux Surprise</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top left, #6336a8, transparent 40%),
    linear-gradient(135deg, #111827, #30205d, #101827);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 440px;
  background: #1f2937;
  border: 1px solid #8065ff;
  border-radius: 22px;
  padding: 27px;
  text-align: center;
  box-shadow: 0 15px 50px #0008;
}

.logo {
  font-size: 55px;
  animation: float 2s infinite ease-in-out;
}

@keyframes float {
  50% { transform: translateY(-8px) rotate(5deg); }
}

h1 { margin-top: 0; }

input {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 11px 0;
  border-radius: 10px;
  border: 1px solid #4b5563;
  background: #111827;
  color: white;
  font-size: 16px;
}

button, .link {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}

.primary {
  background: linear-gradient(100deg, #7857ff, #b34dff);
  color: white;
}

.roblox {
  background: white;
  color: black;
}

.admin {
  background: #374151;
  color: white;
}

.note {
  color: #cbd5e1;
  font-size: 12px;
  line-height: 1.5;
}

#result, #adminPanel, #helpPanel {
  display: none;
}

.amount {
  font-size: 43px;
  font-weight: bold;
  color: #a7f3d0;
  text-shadow: 0 0 20px #a7f3d055;
  animation: pop 0.8s infinite alternate;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}

.entry {
  text-align: right;
  white-space: pre-line;
  overflow-wrap: anywhere;
  background: #111827;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
}

#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.piece {
  position: absolute;
  top: -20px;
  width: 9px;
  height: 14px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body>
<div id="confetti"></div>

<main class="card">
  <div class="logo">💎</div>
  <h1>Robux Surprise!</h1>
  <p>הפתעה מיוחדת לשחקני Roblox 🎮</p>

  <form id="form">
    <input name="first" placeholder="שם פרטי" required maxlength="60">
    <input name="last" placeholder="שם משפחה" required maxlength="60">
    <input name="city" placeholder="מקום מגורים (לא חובה)" maxlength="80">
    <input name="birth" type="date" aria-label="תאריך לידה">
    <input name="username" placeholder="שם משתמש ב-Roblox" required maxlength="60">

    <label class="note">
      <input id="consent" type="checkbox" required style="width:auto;display:inline">
      אני מסכים/ה לשמירת הפרטים בדפדפן הזה.
    </label>

    <button class="primary" type="submit">
      בדיקת ההפתעה ✨
    </button>
  </form>

  <section id="result">
    <h2>🎉</h2>
    <div class="amount">+1,000</div>
    <p>פתחו את האפליקציה Roblox לקבלת הרובאקס</p>

    <a class="link roblox"
       href="https://www.roblox.com/"
       target="_blank" rel="noopener">
      פתיחת Roblox 🎮
    </a>

    <button class="admin" id="soundAgain" type="button">
      🔊 השמעת הצליל שוב
    </button>
  </section>

  <button class="admin" id="helpButton" type="button">
    ❓ עזרה
  </button>

  <section id="helpPanel">
    <h3>🔐 כניסת מנהלים</h3>
    <input id="adminCode" type="password" placeholder="הכנס קוד מנהל" autocomplete="off">
    <button class="primary" id="unlockButton" type="button">כניסה</button>
    <p id="codeMessage" class="note"></p>
  </section>

  <section id="adminPanel">
    <h3>📋 כניסות שנשמרו בדפדפן הזה</h3>
    <div id="entries"></div>
    <button class="admin" id="clearButton" type="button">
      מחיקת כל הרשומות
    </button>
  </section>

  <p class="note">Fan-made demo</p>
</main>

<script>
const STORAGE_KEY = "robux_demo_entries_v1";

const form = document.getElementById("form");
const result = document.getElementById("result");
const helpPanel = document.getElementById("helpPanel");
const adminPanel = document.getElementById("adminPanel");
const adminCode = document.getElementById("adminCode");
const codeMessage = document.getElementById("codeMessage");
const entries = document.getElementById("entries");

let adminUnlocked = false;

function readEntries() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  } catch {
    return [];
  }
}

function playSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    const ctx = new AudioCtx();
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const start = ctx.currentTime + i * 0.14;

      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(0.12, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.24);
    });

    setTimeout(() => ctx.close(), 1300);
  } catch {}
}

function confetti() {
  const host = document.getElementById("confetti");
  const colors = ["#a78bfa", "#67e8f9", "#f0abfc", "#86efac", "#fde68a"];
  host.replaceChildren();

  for (let i = 0; i < 60; i++) {
    const piece = document.createElement("div");
    piece.className = "piece";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = Math.random() * 0.7 + "s";
    host.appendChild(piece);
  }

  setTimeout(() => host.replaceChildren(), 4000);
}

form.addEventListener("submit", event => {
  event.preventDefault();

  if (!document.getElementById("consent").checked) return;

  const data = new FormData(form);
  const record = {
    first: data.get("first"),
    last: data.get("last"),
    city: data.get("city"),
    birth: data.get("birth"),
    username: data.get("username"),
    date: new Date().toLocaleString("he-IL")
  };

  try {
    const all = readEntries();
    all.push(record);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  } catch {
    alert("לא ניתן לשמור בדפדפן הזה.");
  }

  form.hidden = true;
  result.style.display = "block";
  confetti();
  playSound();
});

document.getElementById("soundAgain").addEventListener("click", playSound);

document.getElementById("helpButton").addEventListener("click", () => {
  helpPanel.style.display =
    helpPanel.style.display === "block" ? "none" : "block";
});

document.getElementById("unlockButton").addEventListener("click", () => {
  if (adminCode.value === "2015") {
    adminUnlocked = true;
    codeMessage.textContent = "הקוד נכון! ✅";
    adminPanel.style.display = "block";
    renderEntries();
  } else {
    adminUnlocked = false;
    codeMessage.textContent = "קוד שגוי! ❌";
    adminPanel.style.display = "none";
  }
});

function renderEntries() {
  entries.replaceChildren();
  const all = readEntries();

  if (!all.length) {
    entries.textContent = "אין רשומות שמורות בדפדפן הזה.";
    return;
  }

  all.forEach(record => {
    const box = document.createElement("div");
    box.className = "entry";
    box.textContent = [
      "שם: " + record.first + " " + record.last,
      "מגורים: " + (record.city || "לא צוין"),
      "תאריך לידה: " + (record.birth || "לא צוין"),
      "שם משתמש: " + record.username,
      "תאריך: " + record.date
    ].join("\n");
    entries.appendChild(box);
  });
}

document.getElementById("clearButton").addEventListener("click", () => {
  if (!adminUnlocked) return;

  if (confirm("למחוק את כל הרשומות בדפדפן הזה?")) {
    localStorage.removeItem(STORAGE_KEY);
    renderEntries();
  }
});
</script>
</body>
</html>
